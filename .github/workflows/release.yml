name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build (stamped with tag)
        run: make all VERSION=${{ github.ref_name }}
      - name: grant raw-ICMP to the trace binary
        run: sudo setcap cap_net_raw+ep dist/dropline-linux-amd64
      - name: end-to-end smoke (loopback) — release gate
        run: make e2e
      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/dropline-linux-amd64 \
            dist/dropline-linux-arm64 \
            dist/dropline-windows-amd64.exe \
            dist/SHA256SUMS \
            --title "${{ github.ref_name }}" \
            --generate-notes
