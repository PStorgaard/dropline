name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: cross-compile (linux-amd64, linux-arm64, windows-amd64)
        run: make all
      - name: grant raw-ICMP to the trace binary
        run: sudo setcap cap_net_raw+ep dist/dropline-linux-amd64
      - name: end-to-end smoke (loopback)
        run: make e2e
